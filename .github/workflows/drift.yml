name: detection-ecarts
on:
  schedule:
    - cron: "0 6 * * *"        # chaque jour à 6 h UTC (9 h à Madagascar)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dossier: [socle, envs/dev/aws]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_READONLY_ROLE_ARN }}
          aws-region: eu-west-3
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: L'environnement existe-t-il ?
        id: env
        run: |
          if [ "${{ matrix.dossier }}" = "socle" ] || aws eks describe-cluster --name gitops-dev >/dev/null 2>&1; then
            echo "actif=true" >> "$GITHUB_OUTPUT"
          else
            echo "actif=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan
        id: plan
        if: steps.env.outputs.actif == 'true'
        working-directory: ${{ matrix.dossier }}
        run: |
          terraform init -input=false
          set +e
          terraform plan -detailed-exitcode -lock=false -input=false -no-color > plan.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Ouvrir un ticket en cas d'écart
        if: steps.plan.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Écart détecté (${{ matrix.dossier }}) le $(date +%F)" \
            --body-file ${{ matrix.dossier }}/plan.txt --label derive

      - name: Échec en cas d'erreur
        if: steps.plan.outputs.code == '1'
        run: exit 1
